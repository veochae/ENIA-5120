name: Sync course materials to Canvas

on:
  push:
    branches: ["main"]
    paths:
      - "sessions/**"
      - "canvas/**"
      - "course_schedule.yaml"
      - ".github/workflows/canvas-sync.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.2.313'        

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Install R package dependencies
        run: |
          Rscript -e 'pkgs <- c("jsonlite","dplyr","readr","ggplot2","tidyr","httr","stringr","purrr","lubridate","htmltools","rmarkdown","knitr"); inst <- rownames(installed.packages()); to_install <- setdiff(pkgs, inst); if (length(to_install)) install.packages(to_install, repos = "https://cloud.r-project.org")'

      - name: Render slides
        run: |
          find sessions -name "slides.qmd" -print0 | xargs -0 -n1 quarto render

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Cache Pandoc + LaTeX engine
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra
          version: 1.0

      - name: Render PDF handouts
        run: |
          python scripts/render_handouts.py

      - name: Sync to Canvas
        env:
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          python -m canvas.sync_to_canvas
