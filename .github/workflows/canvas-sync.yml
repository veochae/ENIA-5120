name: Sync course materials to Canvas

on:
  push:
    branches: ["main"]
    paths:
      - "sessions/**"
      - "canvas/**"
      - "course_schedule.yaml"
      - ".github/workflows/canvas-sync.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: |
          find sessions -name "slides.qmd" -print0 | xargs -0 -n1 quarto render

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Sync to Canvas
        env:
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          python -m canvas.sync_to_canvas
