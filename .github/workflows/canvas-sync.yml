name: Sync course materials to Canvas

on:
  push:
    branches: ["main"]
    paths:
      - "sessions/**"
      - "canvas/**"
      - "course_schedule.yaml"
      - ".github/workflows/canvas-sync.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.2.313'        

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite","dplyr","readr","ggplot2","tidyr","httr","stringr","purrr","lubridate"), repos = "https://cloud.r-project.org")'

      - name: Render slides
        run: |
          find sessions -name "slides.qmd" -print0 | xargs -0 -n1 quarto render

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Install Pandoc + LaTeX engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Render PDF handouts
        run: |
          python scripts/render_handouts.py

      - name: Sync to Canvas
        env:
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          python -m canvas.sync_to_canvas
